<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10121b"><meta name="apple-mobile-web-app-capable" content="yes"><title>Gamer's Chronicle</title><style>
:root{--bg:#0d1018;--panel:#181d2a;--panel2:#222839;--gold:#e5bd75;--muted:#9ba6b9;--ink:#f2eee6;--line:#343b4b;--green:#7fd6ac}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#33314a 0%,var(--bg) 55%);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;min-height:100vh}header{padding:28px 18px 14px;text-align:center}header small{display:block;letter-spacing:.25em;color:var(--gold);font-size:10px}header h1{font:small-caps 29px Georgia,serif;color:var(--gold);margin:7px 0 0;letter-spacing:.035em}header p{color:var(--muted);font-size:12px;margin:6px}.wrap{max-width:740px;margin:auto;padding:0 14px 110px}.panel{background:linear-gradient(140deg,#1d2231,#151923);border:1px solid var(--line);border-radius:15px;padding:17px;margin:12px 0;box-shadow:0 6px 22px #0003}.hero{border-color:#796343;background:linear-gradient(130deg,#302b2d,#1b2130 75%)}h2{font-size:16px;color:var(--gold);margin:0 0 14px;letter-spacing:.04em}h3{font-size:14px;margin:0 0 8px}p{line-height:1.6}.muted,.hint{color:var(--muted);font-size:12px}.heroTop{display:flex;gap:15px;align-items:center}.avatar{width:76px;height:76px;border-radius:18px;background:linear-gradient(140deg,#67543b,#272d42);border:1px solid #b99c6a;display:grid;place-items:center;font-size:36px}.level{font:26px Georgia,serif;color:#fff}.bar{height:9px;background:#353747;border-radius:10px;overflow:hidden;margin:9px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#8b6639,#f0d492);width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{background:#ffffff08;padding:12px 7px;text-align:center;border:1px solid #ffffff0c;border-radius:10px}.stat strong{display:block;font-size:19px;color:#f0d49a}.stat small{color:var(--muted);font-size:10px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#131824f5;backdrop-filter:blur(12px);border-top:1px solid #4b4550;display:flex;justify-content:center;padding:8px 4px calc(9px + env(safe-area-inset-bottom));z-index:5}.tabs button{flex:1;max-width:145px;background:none;color:var(--muted);border:0;font-size:10px;padding:6px 0}.tabs button span{display:block;font-size:22px;margin-bottom:3px}.tabs button.active{color:var(--gold)}button,.btn{cursor:pointer;touch-action:manipulation}.primary{background:linear-gradient(120deg,#ad844c,#e4bf7b);color:#1c1a18;border:0;border-radius:10px;padding:12px 14px;font-weight:750}.secondary{background:#2a3041;color:var(--ink);border:1px solid #4a5163;border-radius:10px;padding:10px 12px}.danger{color:#ffc5bb;border-color:#865551}.full{width:100%}input,select,textarea{background:#101520;color:var(--ink);border:1px solid #50566a;border-radius:9px;padding:12px;width:100%;font:inherit;min-width:0}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{padding:12px 0;border-bottom:1px solid #343949}.item:last-child{border:0}.pill{font-size:11px;color:var(--gold);background:#d8ad6430;border:1px solid #a88a4d77;padding:4px 8px;border-radius:20px}.locked{opacity:.56}.progress{height:6px;background:#343a4b;border-radius:8px;overflow:hidden;margin:7px 0}.progress>i{display:block;height:100%;background:#c5a36e}.notice{padding:12px;border-radius:10px;background:#2b332c;border:1px solid #5d7b5d;color:#c4edcf;font-size:12px;margin:12px 0}.hidden{display:none!important}.mini{font-size:12px}.badge{color:var(--gold);font-size:11px}.chartrow{display:grid;grid-template-columns:86px 1fr 54px;gap:9px;align-items:center;margin:13px 0;font-size:12px}.chartrow .progress{margin:0}.empty{padding:25px 10px;text-align:center;color:var(--muted)}.toast{position:fixed;top:12px;left:10%;width:80%;background:#3c4b39;border:1px solid #88b782;padding:12px;border-radius:12px;z-index:20;text-align:center;display:none}footer{text-align:center;color:#6c778a;font-size:11px;margin:28px 0}a{color:var(--gold)}
</style></head><body><header><small>THE LEGEND OF YOUR GAMING JOURNEY</small><h1>Gamer's Chronicle</h1><p>すべての冒険は、記録から伝説になる。</p></header><div class="wrap"><main id="screen"></main><footer>Dark Fantasy Edition · v1.0 · Local-first</footer></div><nav class="tabs" id="tabs"></nav><div id="toast" class="toast"></div><script>
'use strict';
const KEY='gamers_chronicle_v1';const TYPES=[{id:'clear',name:'ゲームクリア',icon:'⚔️',xp:500},{id:'achievement',name:'実績解除',icon:'🏅',xp:30},{id:'perfect',name:'実績100%達成',icon:'🏆',xp:1000},{id:'crown',name:'金冠獲得',icon:'👑',xp:150},{id:'rare',name:'レアアイテム入手',icon:'💎',xp:100},{id:'challenge',name:'高難度クリア',icon:'🐉',xp:600},{id:'collection',name:'コレクション達成',icon:'📜',xp:250},{id:'other',name:'その他の達成',icon:'✨',xp:80}];const QUESTS=[{id:'first',name:'冒険の第一歩',desc:'活動を1回記録',kind:'all',goal:1,reward:100},{id:'hunter',name:'金冠を追う者',desc:'金冠を5回獲得',kind:'crown',goal:5,reward:300},{id:'master',name:'熟練の狩人',desc:'金冠を25回獲得',kind:'crown',goal:25,reward:1200},{id:'trophy',name:'実績蒐集家',desc:'実績を20個解除',kind:'achievement',goal:20,reward:400},{id:'trophy2',name:'実績の賢者',desc:'実績を100個解除',kind:'achievement',goal:100,reward:2000},{id:'clear3',name:'世界を渡る旅人',desc:'ゲームを3本クリア',kind:'clear',goal:3,reward:400},{id:'clear10',name:'百戦錬磨',desc:'ゲームを10本クリア',kind:'clear',goal:10,reward:1500},{id:'perfect3',name:'完全なる支配者',desc:'実績100%を3回達成',kind:'perfect',goal:3,reward:1200},{id:'rare10',name:'秘宝探究者',desc:'レアアイテムを10回入手',kind:'rare',goal:10,reward:500},{id:'all50',name:'歴史を刻む者',desc:'活動を50回記録',kind:'all',goal:50,reward:2000}];const ACH=[{id:'a1',name:'最初の一頁',kind:'all',goal:1,rarity:'COMMON'},{id:'a2',name:'冒険日誌',kind:'all',goal:10,rarity:'COMMON'},{id:'a3',name:'不朽の記録者',kind:'all',goal:100,rarity:'LEGENDARY'},{id:'c1',name:'初冠',kind:'crown',goal:1,rarity:'COMMON'},{id:'c2',name:'金冠収集家',kind:'crown',goal:10,rarity:'RARE'},{id:'c3',name:'金冠の覇王',kind:'crown',goal:50,rarity:'LEGENDARY'},{id:'s1',name:'勝利の味',kind:'clear',goal:1,rarity:'COMMON'},{id:'s2',name:'世界の踏破者',kind:'clear',goal:10,rarity:'EPIC'},{id:'s3',name:'百の世界を越えて',kind:'clear',goal:100,rarity:'LEGENDARY'},{id:'t1',name:'トロフィーハンター',kind:'achievement',goal:10,rarity:'COMMON'},{id:'t2',name:'栄誉の蒐集家',kind:'achievement',goal:100,rarity:'EPIC'},{id:'p1',name:'完璧主義者',kind:'perfect',goal:1,rarity:'RARE'},{id:'p2',name:'完全制覇',kind:'perfect',goal:10,rarity:'LEGENDARY'},{id:'r1',name:'秘宝との邂逅',kind:'rare',goal:1,rarity:'COMMON'},{id:'r2',name:'秘宝の守護者',kind:'rare',goal:25,rarity:'EPIC'},{id:'d1',name:'竜を討つ者',kind:'challenge',goal:1,rarity:'RARE'},{id:'d2',name:'竜殺しの伝説',kind:'challenge',goal:20,rarity:'LEGENDARY'},{id:'l1',name:'蒐集の始まり',kind:'collection',goal:1,rarity:'COMMON'},{id:'l2',name:'万象の収集家',kind:'collection',goal:25,rarity:'EPIC'},{id:'o1',name:'自由な冒険者',kind:'other',goal:10,rarity:'RARE'}];
const fresh=()=>({version:1,name:'名もなき冒険者',records:[],claimed:[],title:'駆け出しの冒険者'});let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')||fresh()}catch{db=fresh()}if(!Array.isArray(db.records))db=fresh();if(!Array.isArray(db.claimed))db.claimed=[];let page='home';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const count=k=>k==='all'?db.records.length:db.records.filter(r=>r.type===k).reduce((s,r)=>s+r.qty,0);const xpRecords=()=>db.records.reduce((s,r)=>s+r.xp,0);const xpTotal=()=>xpRecords()+db.claimed.reduce((s,id)=>s+(QUESTS.find(q=>q.id===id)?.reward||0),0);const level=x=>Math.floor(Math.sqrt(x/120))+1;const floorXP=l=>120*(l-1)*(l-1);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{return false}};const toast=t=>{const n=$('toast');n.textContent=t;n.style.display='block';setTimeout(()=>n.style.display='none',2400)};const type=k=>TYPES.find(t=>t.id===k)||TYPES[7];const prog=(v,m)=>`<div class="progress"><i style="width:${Math.min(100,100*v/m)}%"></i></div>`;const nav=[['home','🏰','拠点'],['record','⚔️','記録'],['quests','📜','クエスト'],['ach','🏆','実績'],['stats','📊','統計']];
function render(){const xp=xpTotal(),lv=level(xp);$('tabs').innerHTML=nav.map(([id,icon,name])=>`<button class="${page===id?'active':''}" data-nav="${id}"><span>${icon}</span>${name}</button>`).join('');const pages={home:home,record:record,quests:quests,ach:ach,stats:stats};$('screen').innerHTML=pages[page]();document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render();window.scrollTo(0,0)});wire();}
function home(){const xp=xpTotal(),lv=level(xp),current=xp-floorXP(lv),next=floorXP(lv+1)-floorXP(lv);const unlocked=ACH.filter(a=>count(a.kind)>=a.goal);const recent=db.records.slice(0,4);return `<section class="panel hero"><div class="heroTop"><div class="avatar">🛡️</div><div><div class="muted">${esc(db.title)}</div><div class="level">Lv. ${lv}</div><strong>${esc(db.name)}</strong></div></div><div class="row" style="margin-top:15px"><span class="mini">EXP ${current.toLocaleString()} / ${next.toLocaleString()}</span><span class="badge">累計 ${xp.toLocaleString()} EXP</span></div><div class="bar"><i style="width:${current/next*100}%"></i></div><div class="stats"><div class="stat"><strong>${db.records.length}</strong><small>活動記録</small></div><div class="stat"><strong>${unlocked.length}/${ACH.length}</strong><small>解放実績</small></div><div class="stat"><strong>${db.claimed.length}/${QUESTS.length}</strong><small>完了クエスト</small></div></div></section><section class="panel"><h2>⚔️ 冒険を記録</h2><p class="muted">ゲームで達成したことを記録して経験値を獲得しよう。</p><button class="primary full" id="goRecord">新しい達成を記録する ＋</button></section><section class="panel"><h2>🌌 最近の冒険</h2>${recent.length?recent.map(r=>`<div class="item row"><div><strong>${type(r.type).icon} ${esc(r.game||type(r.type).name)}</strong><div class="muted">${esc(r.note||type(r.type).name)} · ${esc(r.date)}</div></div><span class="badge">+${r.xp} XP</span></div>`).join(''):'<div class="empty">まだ記録はない。最初の冒険を刻もう。</div>'}</section><section class="panel"><h2>⚙️ 冒険者設定・セーブ</h2><label>冒険者名</label><input id="playerName" maxlength="32" value="${esc(db.name)}"><label>装備する称号</label><select id="titleSelect"><option value="駆け出しの冒険者">駆け出しの冒険者</option>${unlocked.map(a=>`<option value="${esc(a.name)}" ${db.title===a.name?'selected':''}>${esc(a.name)}</option>`).join('')}</select><button class="secondary full" id="saveProfile" style="margin-top:12px">プロフィールを保存</button><div class="grid2" style="margin-top:12px"><button class="secondary" id="export">セーブを書き出す</button><button class="secondary" id="importButton">セーブを読み込む</button></div><input type="file" id="importFile" accept="application/json,.json" class="hidden"><p class="hint">データはこのブラウザ内に保存される。Safariのサイトデータ消去や別の開き方への変更で失われる場合があるため、JSONバックアップを定期的に「ファイル」に保存してね。</p></section>`}
function record(){return `<section class="panel"><h2>⚔️ 新しい達成</h2><form id="recordForm"><label>活動の種類</label><select id="activity">${TYPES.map(t=>`<option value="${t.id}">${t.icon} ${t.name}（${t.xp} EXP/件）</option>`).join('')}</select><label>ゲームタイトル</label><input id="game" placeholder="例：モンスターハンターライズ" maxlength="100" required><label>達成内容・メモ（任意）</label><textarea id="note" rows="2" maxlength="300" placeholder="例：テオ・テスカトル最小金冠"></textarea><label>達成件数（1〜100）</label><input id="qty" type="number" min="1" max="100" value="1" required><label>達成日</label><input id="date" type="date" required><p class="hint">同じ種類の達成をまとめて記録できるよ。経験値は件数分加算される。ゲームの実際の達成を記録してね。</p><button class="primary full" type="submit">冒険日誌に記録する</button></form></section><section class="panel"><h2>📖 活動履歴</h2>${db.records.length?db.records.slice(0,60).map(r=>`<div class="item"><div class="row"><strong>${type(r.type).icon} ${esc(r.game)}</strong><span class="badge">+${r.xp} XP</span></div><div class="muted">${esc(r.note||type(r.type).name)} · ${esc(r.date)} · ${r.qty}件</div><button class="secondary danger mini" style="margin-top:8px;padding:5px 9px" data-delete="${r.id}">削除</button></div>`).join(''):'<div class="empty">記録なし</div>'}</section>`}
function quests(){return `<section class="panel"><h2>📜 冒険者ギルドの依頼</h2><p class="muted">達成条件を満たすと報酬EXPを受け取れる。報酬は1回限り。</p>${QUESTS.map(q=>{const v=count(q.kind),done=v>=q.goal,claimed=db.claimed.includes(q.id);return `<div class="item"><div class="row"><strong>${claimed?'✅ ':done?'✨ ':'🔒 '}${q.name}</strong><span class="badge">+${q.reward} XP</span></div><div class="muted">${q.desc} · ${Math.min(v,q.goal)}/${q.goal}</div>${prog(v,q.goal)}${claimed?'<span class="muted">報酬受取済み</span>':done?`<button class="primary" data-claim="${q.id}">報酬を受け取る</button>`:'<span class="muted">進行中</span>'}</div>`}).join('')}</section>`}
function ach(){let unlocked=0;return `<section class="panel"><h2>🏆 伝説の実績図鑑</h2><p class="muted">達成条件を満たすと自動で解放される。称号として装備も可能。</p>${ACH.map(a=>{const v=count(a.kind),done=v>=a.goal;if(done)unlocked++;return `<div class="item ${done?'':'locked'}"><div class="row"><strong>${done?'🏅':'🔒'} ${a.name}</strong><span class="pill">${a.rarity}</span></div><div class="muted">${done?'解放済み':'未解放'} · ${type(a.kind).name==='その他の達成'&&a.kind==='all'?'活動記録':a.kind==='all'?'活動記録':type(a.kind).name} ${Math.min(v,a.goal)}/${a.goal}</div>${prog(v,a.goal)}</div>`}).join('')}</section>`}
function stats(){const x=xpTotal(),max=Math.max(1,...TYPES.map(t=>count(t.id)));return `<section class="panel"><h2>📊 冒険の記録</h2><div class="stats"><div class="stat"><strong>${x.toLocaleString()}</strong><small>累計EXP</small></div><div class="stat"><strong>${db.records.reduce((s,r)=>s+r.qty,0)}</strong><small>達成件数</small></div><div class="stat"><strong>${new Set(db.records.map(r=>r.game.trim().toLowerCase())).size}</strong><small>記録ゲーム数</small></div></div></section><section class="panel"><h2>🗡️ 分野別スキル</h2>${TYPES.map(t=>{const v=count(t.id),sx=db.records.filter(r=>r.type===t.id).reduce((s,r)=>s+r.xp,0),sl=level(sx);return `<div class="item"><div class="row"><strong>${t.icon} ${t.name}</strong><span class="badge">Lv.${sl}</span></div><div class="muted">${v}件 · ${sx.toLocaleString()} EXP</div>${prog(sx-floorXP(sl),floorXP(sl+1)-floorXP(sl))}</div>`}).join('')}</section><section class="panel"><h2>📈 活動の内訳</h2>${TYPES.map(t=>`<div class="chartrow"><span>${t.icon} ${t.name}</span>${prog(count(t.id),max)}<span style="text-align:right">${count(t.id)}件</span></div>`).join('')}</section><section class="panel"><h2>📅 月別獲得EXP</h2>${(()=>{const m={};db.records.forEach(r=>{const k=r.date.slice(0,7);m[k]=(m[k]||0)+r.xp});const entries=Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12),mx=Math.max(1,...entries.map(e=>e[1]));return entries.length?entries.map(([k,v])=>`<div class="chartrow"><span>${k}</span>${prog(v,mx)}<span style="text-align:right">${v}</span></div>`).join(''):'<div class="empty">記録が増えるとグラフが表示される</div>'})()}</section>`}
function wire(){if(page==='home'){$('goRecord').onclick=()=>{page='record';render()};$('saveProfile').onclick=()=>{db.name=$('playerName').value.trim()||'名もなき冒険者';db.title=$('titleSelect').value;save();render();toast('プロフィールを保存した')};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gamers-chronicle-save-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('セーブファイルを作成した')};$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.version!==1||!Array.isArray(d.records)||!Array.isArray(d.claimed)||typeof d.name!=='string'||d.records.some(r=>!TYPES.some(t=>t.id===r.type)||!Number.isInteger(r.qty)||r.qty<1||r.qty>100||!Number.isFinite(r.xp)||r.xp<0||typeof r.date!=='string'))throw Error();if(!confirm('現在の記録を読み込んだセーブで上書きする？ 先にバックアップを取ることをおすすめします。'))return;db={version:1,name:d.name.slice(0,32),title:String(d.title||'駆け出しの冒険者'),records:d.records.map(r=>({...r,game:String(r.game||'').slice(0,100),note:String(r.note||'').slice(0,300)})),claimed:d.claimed.filter(id=>QUESTS.some(q=>q.id===id))};if(!save())throw Error();render();toast('セーブを復元した')}catch{alert('読み込めないセーブファイルです。')}}}
if(page==='record'){$('date').value=new Date().toLocaleDateString('sv-SE');$('recordForm').onsubmit=e=>{e.preventDefault();const t=type($('activity').value),qty=Number($('qty').value),game=$('game').value.trim();if(!game||!Number.isInteger(qty)||qty<1||qty>100)return;db.records.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),type:t.id,game,note:$('note').value.trim(),qty,xp:t.xp*qty,date:$('date').value});save();render();toast('+'+(t.xp*qty)+' EXP 獲得！')};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('この達成記録を削除する？ EXPも再計算されます。')){db.records=db.records.filter(r=>r.id!==b.dataset.delete);save();render()}})}if(page==='quests')document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{const q=QUESTS.find(q=>q.id===b.dataset.claim);if(q&&!db.claimed.includes(q.id)&&count(q.kind)>=q.goal){db.claimed.push(q.id);save();render();toast('報酬 +'+q.reward+' EXP！')}})}render();
</script></body></html>
